name: Build Kinolet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinolet-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # The worker recipe pins this exact Go toolchain in its source manifest.
      # No private upstream exporter or release credentials are used by this job.
      - name: Install pinned torrent worker toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: false
          cache: false

      - name: Verify torrent worker toolchain pin
        run: |
          test "$(go env GOVERSION)" = "go1.26.4"
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('Apps/Mac/Resources/Torrent/worker-manifest.json').read_text())
          assert manifest['go_toolchain'] == 'go1.26.4'
          PY

      - name: Show Apple toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen meson ninja cmake pkg-config

      - name: Cache verified dependency builds
        uses: actions/cache@v4
        with:
          path: |
            ThirdParty/downloads
            ThirdParty/dav1d-min
            ThirdParty/speex-min
            ThirdParty/ffmpeg-min
            ThirdParty/subtitles-min
            ThirdParty/sparkle-min
            .build/torrent-worker
          key: kinolet-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ThirdParty/deps.lock.json', 'Scripts/build_*.sh', 'Scripts/lib/**', 'Scripts/patches/**', 'Scripts/build_torrent_worker.py', 'Scripts/prepare_torrent_worker.sh', 'Apps/Mac/Resources/Torrent/worker-manifest.json', 'Apps/Mac/Resources/Torrent/*.patch') }}
          # Recipes revalidate source locks, tools and build stamps before reuse.
          restore-keys: |
            kinolet-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Check playback gestures
        run: ./Scripts/test_playback_gestures.sh

      - name: Check picture adjustments
        run: ./Scripts/test_color_adjust.sh

      - name: Check picture shader on Metal
        shell: bash
        run: |
          if ./Scripts/test_picture_adjust.sh; then
            exit 0
          else
            status=$?
            if [ "$status" -eq 77 ]; then
              echo "Metal device unavailable on this runner; GPU picture checks skipped."
              exit 0
            fi
            exit "$status"
          fi

      - name: Check playback, playlist and torrent models
        run: |
          ./Scripts/test_brand_migration.sh
          ./Scripts/test_turbo_speed.sh
          ./Scripts/test_video_click.sh
          ./Scripts/test_playback_feedback.sh
          ./Scripts/test_playback_control_intent.sh
          ./Scripts/test_playback_diagnostics.sh
          ./Scripts/test_playback_diagnostic_projection.sh
          ./Scripts/test_torrent_background_admission.sh
          ./Scripts/test_torrent_background_urls.sh
          ./Scripts/test_torrent_background_lifecycle.sh
          ./Scripts/test_torrent_subtitle_cache.sh
          ./Scripts/test_torrent_preview_cache.sh
          ./Scripts/test_persistent_thumbnail_store.sh
          ./Scripts/test_video_context_menu.sh
          ./Scripts/test_video_context_policy.sh
          ./Scripts/test_floating_video.sh
          ./Scripts/test_buffered_timeline.sh
          ./Scripts/test_cached_timeline.sh
          ./Scripts/test_source_playback_waiting.sh
          ./Scripts/test_torrent_cache_timeline.sh
          ./Scripts/test_torrent_cache_polling.sh
          ./Scripts/test_playlist_filesystem.sh
          ./Scripts/test_playlist_keyboard.sh
          ./Scripts/test_playlist_file_download_rows.sh
          ./Scripts/test_torrent_file_saves.sh
          ./Scripts/test_torrent_buffer_metrics.sh
          ./Scripts/test_torrent_models.sh
          ./Scripts/test_torrent_server.sh
          ./Scripts/test_torrent_pause_buffer.sh
          ./Scripts/test_torrent_prefetch_lifecycle.sh
          ./Scripts/test_torrent_window_lifecycle.sh
          ./Scripts/test_torrent_recents.sh
          ./Scripts/test_torrent_resume_store.sh

      - name: Check public repository boundary
        run: ./Scripts/check_public_repo.sh

      - name: Build and verify Release app
        run: ./Apps/Mac/Scripts/build.sh Release

      - name: Check native HTTP range recovery
        env:
          FFMPEG_INCLUDE_DIR: ${{ github.workspace }}/ThirdParty/ffmpeg-min/include
        run: python3 Scripts/tests/http_range_io.py

      - name: Check bundled torrent worker startup
        run: ./Scripts/test_torrent_worker_startup.sh .build/Build/Products/Release/Kinolet.app

      - name: Compile and inspect unsigned App Store archive
        run: ./Scripts/smoke_app_store_unsigned.sh

      - name: Package verified Release download
        if: success()
        run: ./Scripts/package_release_artifact.sh "$RUNNER_TEMP/kinolet-release"

      - name: Package matching release sources
        if: success()
        run: |
          RELEASE_DIRECTORY="$RUNNER_TEMP/kinolet-release"
          SOURCE_ARCHIVE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_archive"])' "$RELEASE_DIRECTORY/build-info.json")"
          python3 Scripts/package_release_sources.py --output "$RELEASE_DIRECTORY/$SOURCE_ARCHIVE" --require-build-metadata
          python3 Scripts/package_release_sources.py --verify "$RELEASE_DIRECTORY/$SOURCE_ARCHIVE"
          python3 - "$RELEASE_DIRECTORY" <<'PY'
          import hashlib
          from pathlib import Path
          import sys
          directory = Path(sys.argv[1])
          files = sorted(path for path in directory.iterdir() if path.name != 'SHA256SUMS')
          assert files and all(path.is_file() and not path.is_symlink() for path in files)
          (directory / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in files))
          PY

      - name: Retain verified Release download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kinolet-release-macos-arm64
          path: ${{ runner.temp }}/kinolet-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
